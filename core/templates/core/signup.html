{% extends 'questions/layout/base.html' %}

{% block content %}

<div class="form_page">

    <div class="H1">
        <h2 class="new_quest">Регистрация</h2>
    </div>

    <form class="user_form">

        <div class="form_row">
            <label for="login">Логин</label>

            <div class="form_field">
                <input
                    id="login"
                    type="text"
                    name="login"
                    placeholder="Введите логин"
                >
            </div>
        </div>

        <div class="form_row">
            <label for="email">Email</label>

            <div class="form_field">
                <input
                    id="email"
                    type="email"
                    name="email"
                    placeholder="Введите email"
                >
            </div>
        </div>

        <div class="form_row">
            <label for="password">Пароль</label>

            <div class="form_field">
                <input
                    id="password"
                    type="password"
                    name="password"
                    placeholder="Введите пароль"
                >
            </div>
        </div>

        <div class="form_row">
            <label for="password_repeat">Повтор</label>

            <div class="form_field">
                <input
                    id="password_repeat"
                    type="password"
                    name="password_repeat"
                    placeholder="Повторите пароль"
                >
            </div>
        </div>

        <div class="form_error">
            Пример ошибки: вы ввели невалидный email
        </div>

        <div class="form_actions">
            <button type="submit">Зарегистрироваться</button>
        </div>

    </form>

</div>

{% endblock %}
