<body>

        <form>
            <input type="search" name="text" class="search" placeholder=" Какой у вас возник вопрос?" >

    <div class="container_user">
     <div class="img_avatar">

       <p class="user_name">Кот Василий </p>

    </div>
    </div>

            <div class="settings_row">

            </div>

            <div class="settings_row">
                <label for="email">Email</label>
                <input id="email" type="email" name="email" value="vasiliy@mur.ru">
            </div>

            <div class="settings_row">
                <label for="nickname">Никнейм</label>
                <input id="nickname" type="text" name="nickname" value="Кот Василий">
            </div>

            <div class="settings_row avatar_row">
                <label>Аватар</label>

                <div class="avatar_settings_block">
                    <div class="settings_avatar_preview">
                        <img src="static/img/e_cat.jpg" alt="">
                    </div>

                    <input class="file_input" type="file" name="avatar">
                </div>
            </div>

            <div class="settings_actions">
                <button type="submit">Сохранить</button>
            </div>
        </form>
    </div>
    </div>
