{% load static %}

<div class="quest1">

    <div class="container_img_likes">

        <div class="img_avatar">
            <img src="{% static 'questions/img/brit_cat.jpg' %}" alt="Аватар вопроса">
        </div>

        <div class="likes">
            <span class="likes_count">{{ question.likes }}</span>

            <div class="likes_buttons">
                {% if user.is_authenticated %}
                    <button type="button">▲</button>
                    <button type="button">▼</button>
                {% else %}
                    <button type="button" disabled title="Войдите, чтобы оценивать вопросы">▲</button>
                    <button type="button" disabled title="Войдите, чтобы оценивать вопросы">▼</button>
                {% endif %}
            </div>
        </div>

    </div>

    <div class="quest">

        <h1 class="question_card_title">
            <a href="{{ question.get_absolute_url }}">
                {{ question.title }}
            </a>
        </h1>

        <p class="question_card_text">
            {{ question.text }}
        </p>

        <div class="answers_tegs">
            <a class="answers_link" href="{{ question.get_absolute_url }}">
                answer ({{ question.answers_count }})
            </a>

            <span class="tags_label">Tags:</span>

            {% for tag in question.tags.all %}
                <a class="question_tag" href="{% url 'questions:tag' tag.slug %}">
                    {{ tag.name }}
                </a>
            {% empty %}
                <span class="question_tag">без тегов</span>
            {% endfor %}
        </div>

    </div>

</div>
